services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatsapp-support-gateway:latest
    container_name: whatsapp-support-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=development
      - WHATSAPP_PROVIDER=mock
      - LLM_PROVIDER=mock
      - META_APP_SECRET=dev_app_secret
      - WEBHOOK_VERIFY_TOKEN=dev_verify_token
      - INTEGRATION_WEBHOOK_URL=http://n8n:5678/webhook/escalation
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
